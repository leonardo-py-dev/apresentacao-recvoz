<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="spec-heat" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#050b1f" />
      <stop offset="35%" stop-color="#1e40af" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ffb347" />
    </linearGradient>
    <marker id="arrow-step" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ffb347" />
    </marker>
  </defs>

  <style>
    .step-title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
    .step-badge { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; fill: #ffb347; }
    .step-desc { font-family: 'Inter', sans-serif; font-size: 17px; fill: #dbeafe; }
    .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #9be7d8; }
  </style>

  <!-- Card 1: STFT -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="285" height="300" rx="16" fill="#070d22dd" stroke="#4aa8ff" stroke-width="2" />
    <text x="20" y="38" class="step-badge">1. STFT → ANALISA O SOM</text>
    <text x="20" y="68" class="step-title">Pequenos Pedaços</text>

    <!-- Ilustração Onda Dividida em Janelas -->
    <rect x="20" y="85" width="245" height="115" rx="10" fill="#02050f" stroke="#334155" stroke-width="1.5" />
    <!-- Linhas de janelas (frames) -->
    <line x1="82" y1="85" x2="82" y2="200" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="142" y1="85" x2="142" y2="200" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="202" y1="85" x2="202" y2="200" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Onda -->
    <path d="M 28 142 Q 45 95, 62 142 T 96 142 Q 115 88, 132 142 T 168 142 Q 185 100, 202 142 T 255 142" fill="none" stroke="#4aa8ff" stroke-width="3.5" />
    <text x="142" y="192" text-anchor="middle" class="axis-label">Janelas (Frames)</text>

    <text x="20" y="235" class="step-desc">Divide a fala ("Bom dia")</text>
    <text x="20" y="260" class="step-desc">e descobre as frequências</text>
    <text x="20" y="285" class="step-desc">de cada pedacinho.</text>
  </g>

  <!-- Seta 1 -> 2 -->
  <path d="M 306 165 L 332 165" stroke="#ffb347" stroke-width="3.5" fill="none" marker-end="url(#arrow-step)" />

  <!-- Card 2: Espectrograma -->
  <g transform="translate(338, 15)">
    <rect x="0" y="0" width="285" height="300" rx="16" fill="#070d22dd" stroke="#ffb347" stroke-width="2.5" />
    <text x="20" y="38" class="step-badge">2. ESPECTROGRAMA</text>
    <text x="20" y="68" class="step-title">Mostra o Som (Gráfico)</text>

    <!-- Ilustração Mapa de Calor -->
    <rect x="20" y="85" width="245" height="115" rx="10" fill="url(#spec-heat)" stroke="#ffb347" stroke-width="1.5" />
    <path d="M 30 165 Q 100 140, 175 120 T 255 110" stroke="#ffffff" stroke-width="3.5" fill="none" />
    <path d="M 30 135 Q 110 110, 185 100 T 255 95" stroke="#ffd66b" stroke-width="3" fill="none" />
    <text x="142" y="192" text-anchor="middle" class="axis-label" fill="#ffffff">Tempo (X) × Freq. (Y)</text>

    <text x="20" y="235" class="step-desc">Transforma o áudio em uma</text>
    <text x="20" y="260" class="step-desc"><tspan fill="#ffd66b" font-weight="700">imagem</tspan>: o brilho mostra</text>
    <text x="20" y="285" class="step-desc">a força de cada frequência.</text>
  </g>

  <!-- Seta 2 -> 3 -->
  <path d="M 629 165 L 655 165" stroke="#ffb347" stroke-width="3.5" fill="none" marker-end="url(#arrow-step)" />

  <!-- Card 3: Escala Mel & MFCCs -->
  <g transform="translate(661, 15)">
    <rect x="0" y="0" width="285" height="300" rx="16" fill="#070d22dd" stroke="#9be7d8" stroke-width="2" />
    <text x="20" y="38" class="step-badge" fill="#9be7d8">3. ESCALA MEL &amp; MFCCs</text>
    <text x="20" y="68" class="step-title">Números para a IA</text>

    <!-- Ilustração Blocos de Coeficientes -->
    <rect x="20" y="85" width="245" height="115" rx="10" fill="#02050f" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(32, 97)">
      <rect x="0" y="0" width="220" height="14" rx="4" fill="#4aa8ff" />
      <rect x="0" y="20" width="185" height="14" rx="4" fill="#9be7d8" />
      <rect x="0" y="40" width="205" height="14" rx="4" fill="#ffb347" />
      <rect x="0" y="60" width="150" height="14" rx="4" fill="#a855f7" />
      <text x="110" y="94" text-anchor="middle" class="axis-label">13 Coeficientes (Números)</text>
    </g>

    <text x="20" y="235" class="step-desc">Imita o <tspan fill="#9be7d8" font-weight="700">ouvido humano</tspan> e</text>
    <text x="20" y="260" class="step-desc">gera os números que</text>
    <text x="20" y="285" class="step-desc">entram na Rede Neural!</text>
  </g>
</svg>
